<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3b872">
  <title>Main Menu Concept Preview</title>
  <link rel="preconnect" href="https://www.fontrepo.com" crossorigin>
  <style>
    @font-face {
      font-family: "Dudu Calligraphy";
      src: url("https://www.fontrepo.com/font/34835/dudu-calligraphy.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #29382a;
      --hand: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", cursive;
      --body: "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: #d7b777;
      font-family: var(--body);
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #e8c786 url("assets/backgrounds/main-menu-golden-field.png") center / cover no-repeat;
    }

    .background-video {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .scene::before {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      content: "";
      background: linear-gradient(90deg, rgba(246, 226, 187, 0.33), rgba(246, 226, 187, 0.12) 31%, transparent 59%);
    }

    .scene::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      content: "";
      background: radial-gradient(ellipse at 50% 42%, transparent 47%, rgba(39, 40, 30, 0.14) 100%);
    }

    .menu-copy {
      position: relative;
      z-index: 2;
      width: min(410px, 38vw);
      margin-left: clamp(28px, 7.5vw, 136px);
      padding: 0;
      color: var(--ink);
      background: transparent;
    }

    .logo-space {
      height: 132px;
      margin: 0 0 5px;
    }

    .page-note {
      margin: 0 0 17px;
      color: #41523c;
      font: 400 1.8rem/1.1 var(--hand);
      text-shadow: 0 1px 8px rgba(255, 238, 193, 0.96), 0 0 16px rgba(255, 231, 174, 0.74);
    }

    .menu {
      display: grid;
      justify-items: start;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu button {
      position: relative;
      width: fit-content;
      min-width: 215px;
      padding: 2px 12px 5px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      color: var(--ink);
      background: transparent;
      font: 400 clamp(2.15rem, 3vw, 3.15rem)/1.06 var(--hand);
      text-align: left;
      text-shadow: 0 1px 8px rgba(255, 239, 199, 0.98), 0 0 17px rgba(255, 231, 174, 0.8);
      cursor: pointer;
      transition: color 180ms ease, transform 240ms ease, border-color 180ms ease;
    }

    .menu button:hover,
    .menu button:focus-visible {
      border-color: rgba(67, 83, 55, 0.64);
      color: #6c4934;
      outline: none;
      transform: translateX(6px) rotate(-0.6deg);
    }

    .status {
      min-height: 1.3em;
      margin: 15px 0 0;
      color: #41523c;
      font: 400 1.25rem/1.2 var(--hand);
      text-shadow: 0 1px 8px rgba(255, 239, 199, 0.98);
    }

    @media (max-width: 760px) {
      .scene { align-items: flex-end; padding: 0 0 6vh; }
      .background-video { object-position: 64% center; }
      .menu-copy { width: min(390px, calc(100vw - 36px)); margin: 0 18px; }
      .logo-space { height: 72px; }
      .page-note { margin-bottom: 8px; }
      .menu { gap: 1px; }
      .menu button { min-height: 49px; font-size: 2.1rem; }
      .status { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Fragment Away main menu concept">
    <video class="background-video" autoplay muted loop playsinline preload="auto" poster="assets/backgrounds/main-menu-golden-field.png" aria-hidden="true">
      <source src="assets/videos/main-menu-wind-6s.mp4" type="video/mp4">
    </video>

    <section class="menu-copy" aria-label="Main menu">
      <div class="logo-space" role="img" aria-label="Blank space reserved for the creator's logo"></div>
      <p class="page-note">A new page</p>
      <nav aria-label="Main menu">
        <ul class="menu">
          <li><button type="button">Continue</button></li>
          <li><button type="button">New Game</button></li>
          <li><button type="button">Settings</button></li>
          <li><button type="button">Credits</button></li>
        </ul>
      </nav>
      <p class="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const video = document.querySelector(".background-video");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const status = document.querySelector(".status");

    function syncMotionPreference() {
      if (reducedMotion.matches) {
        video.pause();
        video.currentTime = 0;
      } else {
        video.play().catch(() => {});
      }
    }

    reducedMotion.addEventListener?.("change", syncMotionPreference);
    syncMotionPreference();

    document.querySelectorAll(".menu button").forEach((button) => {
      button.addEventListener("click", () => {
        status.textContent = `${button.textContent} is a placeholder in this visual preview.`;
      });
    });
  </script>
</body>
</html>
