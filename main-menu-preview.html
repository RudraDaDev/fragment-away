<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3b872">
  <title>Main Menu Concept Preview</title>
  <style>
    @font-face {
      font-family: "Dudu Calligraphy";
      src: url("assets/fonts/Dudu_Calligraphy.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }


    :root {
      color-scheme: light;
      --ink: #624432;
      --clay: #955d3f;
      --loop-duration: 8s;
      --menu-hand: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", cursive;
      --note-hand: "Faraco Hand", "Dudu Calligraphy", cursive;
      --ui-hand: "Helvetihand", "Trebuchet MS", sans-serif;
      --episode-display: "Whatnot", "Dudu Calligraphy", cursive;
      --body: "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: #d7b777;
      font-family: var(--body);
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #e8c786 url("assets/backgrounds/main-menu-golden-field.png") center / cover no-repeat;
    }

    .background-video {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .motion-overlay {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .grass-tuft {
      transform-box: view-box;
      transform-origin: var(--pivot);
      animation: field-sway var(--loop-duration) ease-in-out infinite;
      will-change: transform;
    }

    @keyframes field-sway {
      0%, 100% { transform: rotate(-2.2deg); }
      25% { transform: rotate(3.6deg); }
      50% { transform: rotate(1deg); }
      75% { transform: rotate(-3.4deg); }
    }

    .hair-motion {
      transform-box: view-box;
      transform-origin: 1604px 380px;
      animation: hair-sway var(--loop-duration) ease-in-out infinite;
      will-change: transform;
    }

    @keyframes hair-sway {
      0%, 100% { transform: rotate(-1.5deg); }
      25% { transform: rotate(3deg); }
      50% { transform: rotate(0.5deg); }
      75% { transform: rotate(-2.8deg); }
    }

    .blink-motion {
      opacity: 0;
      animation: natural-blink var(--loop-duration) linear infinite;
    }

    @keyframes natural-blink {
      0%, 24%, 26%, 74%, 76%, 100% { opacity: 0; }
      24.2%, 74.2% { opacity: 0.35; }
      24.55%, 25.45%, 74.55%, 75.45% { opacity: 1; }
      25.8%, 75.8% { opacity: 0; }
    }

    .scene::before {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      content: "";
      background: linear-gradient(90deg, rgba(246, 226, 187, 0.33), rgba(246, 226, 187, 0.12) 31%, transparent 59%);
    }

    .scene::after {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      content: "";
      background: radial-gradient(ellipse at 50% 42%, transparent 47%, rgba(39, 40, 30, 0.14) 100%);
    }

    .episode-display { font-family: var(--episode-display); }

    .menu-copy {
      position: relative;
      z-index: 3;
      width: min(410px, 38vw);
      margin-left: clamp(28px, 7.5vw, 136px);
      padding: 0;
      color: var(--ink);
      background: transparent;
    }

    .logo-space {
      margin: 0 0 5px;
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .page-note {
      margin: 0 0 17px;
      color: var(--clay);
      font: 400 1.8rem/1.1 var(--note-hand);
      text-shadow: 0 1px 8px rgba(255, 238, 211, 0.98), 0 0 16px rgba(255, 231, 194, 0.76);
    }

    .menu {
      display: grid;
      justify-items: start;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu button {
      position: relative;
      width: fit-content;
      min-width: 215px;
      padding: 2px 12px 5px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      color: var(--ink);
      background: transparent;
      font: 400 clamp(2.15rem, 3vw, 3.15rem)/1.06 var(--menu-hand);
      text-align: left;
      text-shadow: 0 1px 8px rgba(255, 239, 213, 0.99), 0 0 17px rgba(255, 231, 194, 0.84);
      cursor: pointer;
      transition: color 180ms ease, transform 240ms ease, border-color 180ms ease;
    }

    .menu button:hover,
    .menu button:focus-visible {
      border-color: rgba(149, 93, 63, 0.64);
      color: #a25d3d;
      outline: none;
      transform: translateX(6px) rotate(-0.6deg);
    }

    .status {
      min-height: 1.3em;
      margin: 15px 0 0;
      color: #80593b;
      font: 400 1.25rem/1.2 var(--ui-hand);
      text-shadow: 0 1px 8px rgba(255, 239, 213, 0.99);
    }

    @media (max-width: 760px) {
      .scene { align-items: flex-end; padding: 0 0 6vh; }
      .background-video { object-position: 90% center; }
      .menu-copy { width: min(390px, calc(100vw - 36px)); margin: 0 18px; }
      .logo-space { height: auto; }
      .page-note { margin-bottom: 8px; }
      .menu { gap: 1px; }
      .menu button { min-height: 49px; font-size: 2.1rem; }
      .status { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      .motion-overlay { display: none; }
    }
  </style>
</head>

  <script>
    const scene = document.querySelector(".scene");
    const video = document.querySelector(".background-video");
    const motionOverlay = document.querySelector(".motion-overlay");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const mobileView = window.matchMedia("(max-width: 760px)");
    const status = document.querySelector(".status");

    function syncOverlayCrop() {
      const { width, height } = scene.getBoundingClientRect();
      if (!width || !height) return;

      const sourceWidth = 2048;
      const sourceHeight = 1152;
      const sceneRatio = width / height;
      let cropWidth = sourceWidth;
      let cropHeight = sourceHeight;
      let cropLeft = 0;
      let cropTop = 0;

      if (sceneRatio < sourceWidth / sourceHeight) {
        cropWidth = sourceHeight * sceneRatio;
        const horizontalPosition = mobileView.matches ? 0.9 : 0.5;
        cropLeft = (sourceWidth - cropWidth) * horizontalPosition;
      } else if (sceneRatio > sourceWidth / sourceHeight) {
        cropHeight = sourceWidth / sceneRatio;
        cropTop = (sourceHeight - cropHeight) * 0.5;
      }

      motionOverlay.setAttribute(
        "viewBox",
        `${cropLeft} ${cropTop} ${cropWidth} ${cropHeight}`,
      );
    }

    function syncMotionPreference() {
      if (reducedMotion.matches) {
        video.pause();
        video.currentTime = 0;
        motionOverlay.style.display = "none";
      } else {
        motionOverlay.style.display = "block";
        video.play().catch(() => {});
      }
    }

    syncOverlayCrop();
    syncMotionPreference();
    window.addEventListener("resize", syncOverlayCrop, { passive: true });
    reducedMotion.addEventListener?.("change", syncMotionPreference);
    mobileView.addEventListener?.("change", syncOverlayCrop);

    document.querySelectorAll(".menu button").forEach((button) => {
      button.addEventListener("click", () => {
        status.textContent = `${button.textContent} is a placeholder in this visual preview.`;
      });
    });
  </script>
